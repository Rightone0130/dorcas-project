<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact - FPI Multimedia Technology</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <main>
    <h1 class="allMainHeader">Contact Us</h1>
    <section class="contact-us-section">
      <h2 class="contact-us-title">Contact Us</h2>
      <p class="contact-us-subtitle">We’d love to hear from you! Fill out the form below to get in touch.</p>
      <form class="contact-us-form">
        <div class="contact-us-group">
          <input type="text" class="contact-us-input" placeholder="Your Name" required />
        </div>
        <div class="contact-us-group">
          <input type="email" class="contact-us-input" placeholder="Your Email" required />
        </div>
        <div class="contact-us-group">
          <textarea class="contact-us-textarea" placeholder="Your Message" rows="5" required></textarea>
        </div>
        <button type="submit" class="contact-us-button">Send Message</button>
      </form>
    </section>
    <div class="subscribeSection">
      <div class="subscribeHeader">Subscribe to our Newsletter!</div>
      <div class="subscribeContainer">
        <div class="subscribeInfo">
          <p>
            Stay updated with the latest news and announcements from our
            department—subscribe now.
          </p>
        </div>

        <form class="subForm">
          <input placeholder="Enter your email" class="subInput" />
          <button class="subButton">Send</button>
        </form>
      </div>
    </div>
  
  </main>

  <div id="footer-placeholder"></div>

</body>
</html>
